# Drop-in that runs the code straight out of this repo directory.
# Install with:
#   sudo mkdir -p /etc/systemd/system/dgxdash.service.d
#   sudo cp deploy/dgxdash-code.conf /etc/systemd/system/dgxdash.service.d/code.conf
#   sudo systemctl daemon-reload && sudo systemctl restart dgxdash
[Service]
WorkingDirectory=/opt/clusterwatch
ExecStart=
ExecStart=/usr/bin/python3 /opt/clusterwatch/dgxdash.py
